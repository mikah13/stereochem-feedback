name: Suggest a feature
description: An idea for something Stereochem should do.
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: Please search the existing issues first. If someone has already suggested it, add a thumbs-up reaction.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task or problem, not only the feature. For example, "I teach organic chemistry and need to show chair conformations side by side."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working.
  - type: textarea
    id: alternatives
    attributes:
      label: What do you use today?
      description: Other tools or workarounds you use for this now.
  - type: dropdown
    id: role
    attributes:
      label: How do you use Stereochem?
      options:
        - Student
        - Teacher or lecturer
        - Researcher
        - Hobbyist
        - Other
